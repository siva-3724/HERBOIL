<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="style.css">
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 8%;
    }

    .header h1 {
      font-size: 24px;
    }



    .checkout-container {
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
    }

    .product {
      display: flex;
      gap: 15px;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .product-info p {
      color: #666;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 14px 0;
      color: #555;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 18px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: bold;
      color: #111;
    }

    .place-order {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .place-order:hover {
      background: #1d4ed8;
    }

    .secure {
      text-align: center;
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
        margin-top: 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

    <section>

      <!-- Customer Details -->
      <div class="card">
        <h2>Customer Details</h2>

        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="siva" />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="prasath" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="sivaprasath@gamil.com" />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 9345668970" />
          </div>
        </div>
      </div>

      <!-- Shipping Address -->
      <div class="card">
        <h2>Shipping Address</h2>

        <div class="form-row">
          <div class="form-group full">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="205 2nd Street" />
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="salem" />
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <select id="state">
              <option value="">Select State</option>
              <option>Tamil Nadu</option>
              <option>Karnataka</option>
              <option>Kerala</option>
              <option>Maharashtra</option>
              <option>Telangana</option>
            </select>
          </div>

          <div class="form-group">
            <label for="zip">PIN Code</label>
            <input type="text" id="zip" placeholder="636636" />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country">
              <option>India</option>
              <option>United States</option>
              <option>United Kingdom</option>
            </select>
          </div>
        </div>
      </div>
